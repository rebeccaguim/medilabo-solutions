<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Details - MédiLabo Solutions</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f7fbfd;
            color: #333;
        }

        header {
            background-color: white;
            padding: 20px 40px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            width: 220px;
            max-width: 100%;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px 50px;
        }

        h1 {
            color: #d9362b;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
        }

        .card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .patient-info {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 12px;
        }

        .label {
            font-weight: bold;
        }

        .risk {
            font-size: 20px;
            font-weight: bold;
        }

        .note {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .note:last-child {
            border-bottom: none;
        }

        .note-text {
            white-space: pre-wrap;
            margin: 0;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-family: Arial, sans-serif;
            resize: vertical;
        }

        .button {
            display: inline-block;
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .primary-button {
            background-color: #d9362b;
            color: white;
        }

        .secondary-button {
            background-color: #f2f2f2;
            color: #333;
        }

        .actions {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <img src="/images/medilabo-logo.png"
         alt="MédiLabo Solutions"
         class="logo">
</header>

<main>

    <h1>Patient Details</h1>

    <section class="card">
        <h2>Patient Information</h2>

        <div class="patient-info">
            <span class="label">First name</span>
            <span th:text="${patient.firstName}"></span>

            <span class="label">Last name</span>
            <span th:text="${patient.lastName}"></span>

            <span class="label">Birth date</span>
            <span th:text="${patient.birthDate}"></span>

            <span class="label">Gender</span>
            <span th:text="${patient.gender}"></span>

            <span class="label">Address</span>
            <span th:text="${patient.address}"></span>

            <span class="label">Phone</span>
            <span th:text="${patient.phone}"></span>
        </div>
    </section>

    <section class="card">
        <h2>Diabetes Risk Assessment</h2>

        <p>
            Risk level:
            <span class="risk"
                  th:text="${riskLevel}">
                Risk level
            </span>
        </p>
    </section>

    <section class="card">
        <h2>Patient History</h2>

        <div th:if="${#lists.isEmpty(notes)}">
            <p>No notes available for this patient.</p>
        </div>

        <div th:each="note : ${notes}"
             class="note">

            <p class="note-text"
               th:text="${note.note}">
            </p>

        </div>
    </section>

    <section class="card">
        <h2>Add Note</h2>

        <form th:action="@{/patients/{id}/notes(id=${patient.id})}"
              method="post">

            <label for="noteText">Medical note</label>

            <br><br>

            <textarea id="noteText"
                      name="noteText"
                      rows="8"
                      required></textarea>

            <br><br>

            <button type="submit"
                    class="button primary-button">
                Add Note
            </button>

        </form>
    </section>

    <div class="actions">
        <a th:href="@{/}"
           class="button secondary-button">
            Back to Patient List
        </a>

        <a th:href="@{/patients/edit/{id}(id=${patient.id})}"
           class="button secondary-button">
            Edit Patient
        </a>
    </div>

</main>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title th:text="${patient.id == null} ? 'Add Patient - MédiLabo Solutions' : 'Edit Patient - MédiLabo Solutions'">
        Patient - MédiLabo Solutions
    </title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f7fbfd;
            color: #333;
        }

        header {
            background-color: white;
            padding: 20px 40px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            width: 220px;
            max-width: 100%;
        }

        main {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px 50px;
        }

        h1 {
            color: #d9362b;
            margin-bottom: 30px;
        }

        .card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .button {
            display: inline-block;
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .primary-button {
            background-color: #d9362b;
            color: white;
        }

        .secondary-button {
            background-color: #f2f2f2;
            color: #333;
        }

        .actions {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <img src="/images/medilabo-logo.png"
         alt="MédiLabo Solutions"
         class="logo">
</header>

<main>

    <h1 th:text="${patient.id == null} ? 'Add Patient' : 'Edit Patient'">
        Patient
    </h1>

    <div class="card">

        <form th:action="${patient.id == null} ? @{/patients} : @{/patients/{id}(id=${patient.id})}"
              th:object="${patient}"
              method="post">

            <div class="form-group">
                <label for="firstName">First name</label>
                <input id="firstName"
                       type="text"
                       th:field="*{firstName}"
                       required>
            </div>

            <div class="form-group">
                <label for="lastName">Last name</label>
                <input id="lastName"
                       type="text"
                       th:field="*{lastName}"
                       required>
            </div>

            <div class="form-group">
                <label for="birthDate">Birth date</label>
                <input id="birthDate"
                       type="date"
                       th:field="*{birthDate}"
                       required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <input id="gender"
                       type="text"
                       th:field="*{gender}"
                       required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input id="address"
                       type="text"
                       th:field="*{address}">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input id="phone"
                       type="text"
                       th:field="*{phone}">
            </div>

            <button type="submit"
                    class="button primary-button">
                Save
            </button>

        </form>

    </div>

    <div class="actions">
        <a th:href="@{/}"
           class="button secondary-button">
            Back to Patient List
        </a>

        <a th:if="${patient.id != null}"
           th:href="@{/patients/view/{id}(id=${patient.id})}"
           class="button secondary-button">
            View Patient
        </a>
    </div>

</main>

</body>
</html>
